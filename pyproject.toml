[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdpa"
version = "0.1.0"
description = "Task-decoupled physical adaptation research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.2",
  "h5py>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
simulation = ["mujoco==3.3.7", "robosuite==1.5.2"]
training = ["gymnasium>=0.29", "robomimic>=0.4"]

[project.scripts]
tdpa-collect = "tdpa.data.interaction_collector:main"
tdpa-sweep-physics = "tdpa.envs.verify_physics:main"
tdpa-pretrain = "tdpa.training.train_encoder:main"
tdpa-train-adapter = "tdpa.training.train_adapter:main"
tdpa-evaluate = "tdpa.evaluation.evaluate_ood:main"
tdpa-adaptation-curve = "tdpa.evaluation.adaptation_curve:main"
tdpa-smoke-robosuite = "tdpa.tools.smoke_robosuite:main"
tdpa-collect-nominal = "tdpa.data.collect_nominal_demos:main"
tdpa-train-nominal = "tdpa.training.train_nominal_policy:main"
tdpa-evaluate-nominal = "tdpa.evaluation.evaluate_nominal_policy:main"
tdpa-evaluate-oracle = "tdpa.evaluation.robosuite_oracle_v2:main"
tdpa-evaluate-oracle-v1 = "tdpa.evaluation.robosuite_oracle_gate:main"
tdpa-evaluate-spatial-oracle = "tdpa.evaluation.robosuite_spatial_residual_gate:main"
tdpa-lift-feasibility = "tdpa.evaluation.lift_feasibility:main"
tdpa-calibrate-lift-friction = "tdpa.evaluation.lift_friction_calibration:main"
tdpa-validate-lift-friction = "tdpa.evaluation.lift_friction_validation:main"
tdpa-smoke-nominal = "tdpa.tools.smoke_nominal_policy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["simulation: requires the optional robosuite / MuJoCo stack"]

[tool.ruff]
line-length = 100
target-version = "py310"
