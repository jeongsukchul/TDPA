version: tdpa-lift-friction-calibration-v1
task: lift

# This grid is a diagnostic calibration protocol, not a training or evaluation
# distribution. It uses fresh reset namespaces and never edits the OOD config.
protocol:
  mass_grid: [0.60, 0.90, 1.20, 1.40]
  friction_grid: [0.16, 0.18, 0.20, 0.22, 0.24, 0.26, 0.28, 0.30]
  seeds: [7101, 7102, 7103]
  episodes_per_seed_point: 5
  reset_index_start: 90000
  controller_profile: high_grip

gate:
  minimum_point_success_rate: 0.80
  minimum_point_success_ci_lower: 0.60
  maximum_force_violation_rate: 0.10
  maximum_controller_saturation_rate: 0.0
  minimum_contiguous_feasible_levels: 2
  train_friction_lower_bound: 0.35
